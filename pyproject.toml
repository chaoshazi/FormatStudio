[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "format-studio"
version = "1.0.0"
description = "Local multi-format converter with data and style templates"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=1.0",
  "pdfplumber>=0.11",
  "pypdfium2>=4.30",
  "pypdf>=5.0",
  "reportlab>=4.2",
  "markdown-it-py>=3.0",
  "charset-normalizer>=3.3",
  "pillow>=10.4",
  "pywin32>=306; sys_platform == 'win32'",
  "pywebview>=5.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "playwright>=1.48",
]

build = [
  "pyinstaller>=6.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
include = ["app*"]